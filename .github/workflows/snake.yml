name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate baby pink contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23F3B8D2&color_dots=%23FFF7FB,%23FDEBF3,%23F9D6E7,%23F3B8D2,%23D98FB3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F3B8D2&color_dots=%2321262D,%23462E3A,%236A4558,%239A5E79,%23D98FB3

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
